<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680">
<title>가채점 비공개 규정을 반영한 11월 26일 파이프라인</title>
<rect x="0" y="0" width="1240" height="680" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="38" y="43" text-anchor="start" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="700" font-size="38" fill="#172832">A·B·C·D 파이프라인 정정</text>
<text x="39" y="86" text-anchor="start" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="500" font-size="21" fill="#536575">예약 취소 실험   ·   모델이 제출을 결정하는 동안 가채점 결과 비공개</text>
<rect x="30" y="120" width="564" height="522" rx="16" fill="#F4F7F9" stroke="none" stroke-width="1"/>
<rect x="610" y="120" width="600" height="522" rx="16" fill="#EFF7F5" stroke="none" stroke-width="1"/>
<text x="56" y="158" text-anchor="start" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="700" font-size="26" fill="#42586A">이전 설계  ·  중간 가채점 사용</text>
<text x="637" y="158" text-anchor="start" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="700" font-size="26" fill="#006859">정정한 설계  ·  제출 확정 뒤 채점</text>
<rect x="55" y="198" width="514" height="79" rx="11" fill="#FFFFFF" stroke="#B9C6D0" stroke-width="1"/>
<text x="312.0" y="224.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="700" font-size="23" fill="#42586A">초안 실행</text>
<text x="312.0" y="252.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="500" font-size="18" fill="#172832">예상 정답과 실제 반환값을 비교</text>
<polyline points="312,277 312,301" fill="none" stroke="#7E909D" stroke-width="2" stroke-linejoin="round"/>
<polygon points="312,301 316.5,292.0 307.5,292.0" fill="#7E909D"/>
<rect x="55" y="302" width="514" height="79" rx="11" fill="#FFFFFF" stroke="#B9C6D0" stroke-width="1"/>
<text x="312.0" y="328.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="700" font-size="23" fill="#42586A">A·B·C가 결과를 보고 수정</text>
<text x="312.0" y="356.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="500" font-size="18" fill="#172832">틀린 사례와 통과한 사례를 입력에 포함</text>
<polyline points="312,381 312,405" fill="none" stroke="#7E909D" stroke-width="2" stroke-linejoin="round"/>
<polygon points="312,405 316.5,396.0 307.5,396.0" fill="#7E909D"/>
<rect x="55" y="406" width="514" height="79" rx="11" fill="#FFFFFF" stroke="#B9C6D0" stroke-width="1"/>
<text x="312.0" y="432.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="700" font-size="23" fill="#42586A">검사 결과로 후보를 축소</text>
<text x="312.0" y="460.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="500" font-size="18" fill="#172832">최고점 동률일 때만 D가 선택</text>
<polyline points="312,485 312,509" fill="none" stroke="#7E909D" stroke-width="2" stroke-linejoin="round"/>
<polygon points="312,509 316.5,500.0 307.5,500.0" fill="#7E909D"/>
<rect x="55" y="510" width="514" height="79" rx="11" fill="#FFFFFF" stroke="#B9C6D0" stroke-width="1"/>
<text x="312.0" y="536.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="700" font-size="23" fill="#42586A">실패가 남으면 한 번 더 호출</text>
<text x="312.0" y="564.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="500" font-size="18" fill="#172832">공개 검사 개선 여부로 최종 제출 결정</text>
<rect x="636" y="198" width="548" height="79" rx="11" fill="#FFFFFF" stroke="#96C9C0" stroke-width="1"/>
<text x="910.0" y="224.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="700" font-size="23" fill="#006859">메인이 공개 명세로 초안 작성</text>
<text x="910.0" y="252.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="500" font-size="18" fill="#172832">초안과 동일한 명세를 A·B·C에 전달</text>
<polyline points="910,277 910,301" fill="none" stroke="#548D84" stroke-width="2" stroke-linejoin="round"/>
<polygon points="910,301 914.5,292.0 905.5,292.0" fill="#548D84"/>
<rect x="636" y="302" width="548" height="79" rx="11" fill="#FFFFFF" stroke="#96C9C0" stroke-width="1"/>
<text x="910.0" y="328.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="700" font-size="23" fill="#006859">A·B·C가 각각 수정 함수 작성</text>
<text x="910.0" y="356.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="500" font-size="18" fill="#172832">다른 감시자의 의견이나 실행 결과 없이 독립 제안</text>
<polyline points="910,381 910,405" fill="none" stroke="#548D84" stroke-width="2" stroke-linejoin="round"/>
<polygon points="910,405 914.5,396.0 905.5,396.0" fill="#548D84"/>
<rect x="636" y="406" width="548" height="79" rx="11" fill="#FFFFFF" stroke="#96C9C0" stroke-width="1"/>
<text x="910.0" y="432.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="700" font-size="23" fill="#006859">D가 명세와 코드만 읽고 선택</text>
<text x="910.0" y="460.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="500" font-size="18" fill="#172832">항상 초안과 수정안 3개 전체에서 하나를 선택</text>
<polyline points="910,485 910,509" fill="none" stroke="#548D84" stroke-width="2" stroke-linejoin="round"/>
<polygon points="910,509 914.5,500.0 905.5,500.0" fill="#548D84"/>
<rect x="636" y="510" width="548" height="79" rx="11" fill="#FFFFFF" stroke="#96C9C0" stroke-width="1"/>
<text x="910.0" y="536.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="700" font-size="23" fill="#006859">모든 시드·비교 조건의 제출 확정</text>
<text x="910.0" y="564.5" text-anchor="middle" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="500" font-size="18" fill="#172832">그 뒤 별도 평가기가 일괄 실행하고 채점</text>
<text x="38" y="663" text-anchor="start" dominant-baseline="central" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-weight="500" font-size="17" fill="#536575">정정한 방식의 호출 순서와 횟수는 실행 전에 고정한다. A·B·C·D 조건은 초안을 포함해 시드당 5회다.</text>
</svg>